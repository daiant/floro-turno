<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    />
    <title>🎫 Turnos</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <style>
      :root {
        --primary: #4f46e5;
        --primary-dark: #3730a3;
        --primary-bg: #eef2ff;
        --success: #059669;
        --success-bg: #d1fae5;
        --warning: #d97706;
        --warning-bg: #fef3c7;
        --danger: #dc2626;
        --text: #1e1b4b;
        --muted: #6b7280;
        --bg: #f5f3ff;
        --card: #ffffff;
        --r: 1.1rem;
        --shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        min-height: 100vh;
        color: var(--text);
      }
      header {
        background: var(--primary);
        color: white;
        padding: 1.25rem 1rem 1rem;
        text-align: center;
      }
      header h1 {
        font-size: 1.4rem;
        font-weight: 800;
        letter-spacing: -0.03em;
      }
      header p {
        font-size: 0.85rem;
        opacity: 0.8;
        margin-top: 0.2rem;
      }
      header a {
        font-size: 0.72rem;
        color: rgba(255, 255, 255, 0.55);
        text-decoration: none;
        display: inline-block;
        margin-top: 0.5rem;
      }
      header a:hover {
        color: white;
      }

      main {
        padding: 1.25rem 1rem 2rem;
        max-width: 440px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 1.1rem;
      }

      /* ── card base ── */
      .card {
        background: var(--card);
        border-radius: var(--r);
        box-shadow: var(--shadow);
        padding: 1.5rem 1.25rem;
        text-align: center;
      }
      .label {
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 0.4rem;
      }
      .big-num {
        font-size: 5.5rem;
        font-weight: 900;
        line-height: 1;
        letter-spacing: -0.05em;
        color: var(--primary);
        transition:
          transform 0.25s,
          color 0.25s;
      }
      .big-num.zero {
        color: #c7d2fe;
      }
      .big-num.pop {
        transform: scale(1.12);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        margin-top: 0.75rem;
        padding: 0.3rem 0.85rem;
        border-radius: 9999px;
        font-size: 0.82rem;
        font-weight: 700;
      }
      .badge.green {
        background: var(--success-bg);
        color: #065f46;
      }
      .badge.amber {
        background: var(--warning-bg);
        color: #92400e;
      }

      .live {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.4rem;
        margin-top: 0.6rem;
        font-size: 0.72rem;
        color: var(--muted);
      }
      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--success);
        animation: pulse 2s infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
      }

      /* ── ticket cards ── */
      #ticketSection .card.get-ticket {
      }
      #ticketSection .card.my-turn {
        background: linear-gradient(135deg, #059669 0%, #047857 100%);
        color: white;
      }
      #ticketSection .card.my-turn .label {
        color: rgba(255, 255, 255, 0.75);
      }
      #ticketSection .card.my-turn .big-num {
        color: white;
        font-size: 6rem;
      }

      #ticketSection .card.waiting {
      }
      #ticketSection .card.waiting .big-num {
        color: var(--warning);
      }

      .subtitle {
        font-size: 0.95rem;
        color: var(--muted);
        margin: 0.5rem 0 1.1rem;
        line-height: 1.4;
      }
      .my-turn .subtitle {
        color: rgba(255, 255, 255, 0.85);
        margin-bottom: 0.85rem;
      }

      .ahead-text {
        font-size: 1rem;
        color: var(--muted);
        margin-top: 0.5rem;
      }

      /* ── buttons ── */
      .btn {
        display: block;
        width: 100%;
        padding: 1rem;
        border: none;
        border-radius: 0.8rem;
        font-size: 1.1rem;
        font-weight: 800;
        cursor: pointer;
        transition:
          transform 0.1s,
          opacity 0.15s;
        letter-spacing: -0.01em;
      }
      .btn:active {
        transform: scale(0.96);
      }
      .btn-primary {
        background: var(--primary);
        color: white;
      }
      .btn-primary:hover {
        opacity: 0.9;
      }
      .btn-ghost {
        background: transparent;
        border: 1.5px solid #e5e7eb;
        color: var(--muted);
        font-size: 0.85rem;
        padding: 0.65rem;
        margin-top: 0.6rem;
      }
      .btn-ghost-white {
        background: rgba(255, 255, 255, 0.18);
        border: 1.5px solid rgba(255, 255, 255, 0.35);
        color: white;
        font-size: 0.9rem;
        padding: 0.7rem;
        margin-top: 0.75rem;
      }

      /* form */
      .field {
        display: block;
        text-align: left;
        margin-top: 0.85rem;
      }
      .field label {
        display: block;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 0.3rem;
      }
      .field input,
      .field textarea {
        width: 100%;
        padding: 0.75rem 0.9rem;
        border: 1.5px solid #e5e7eb;
        border-radius: 0.65rem;
        font-size: 1rem;
        font-family: inherit;
        outline: none;
        box-sizing: border-box;
        background: #fafafa;
      }
      .field input:focus,
      .field textarea:focus {
        border-color: var(--primary);
        background: white;
      }
      .field textarea {
        resize: vertical;
        min-height: 70px;
      }
      .field-error {
        display: none;
        color: var(--danger);
        font-size: 0.8rem;
        margin-top: 0.35rem;
        font-weight: 600;
      }
      .field-error.show {
        display: block;
      }

      /* aviso de renumerado */
      #renumberNotice {
        display: none;
        background: var(--warning-bg);
        color: #92400e;
        padding: 0.7rem 0.9rem;
        border-radius: 0.65rem;
        font-size: 0.88rem;
        font-weight: 600;
        margin-top: 0.85rem;
      }
      #renumberNotice.show {
        display: block;
      }

      /* ── flash overlay ── */
      #flash {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(5, 150, 105, 0.92);
        z-index: 999;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: white;
        text-align: center;
        padding: 2rem;
      }
      #flash.show {
        display: flex;
      }
      #flash .flash-num {
        font-size: 8rem;
        font-weight: 900;
        line-height: 1;
      }
      #flash h2 {
        font-size: 2rem;
        font-weight: 800;
        margin-top: 0.5rem;
      }
      #flash p {
        font-size: 1.1rem;
        opacity: 0.85;
        margin-top: 0.5rem;
      }
      #flash button {
        margin-top: 2rem;
        background: white;
        color: #059669;
        font-weight: 800;
        font-size: 1.1rem;
        padding: 1rem 2rem;
        border: none;
        border-radius: 0.8rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="flash">
      <div class="flash-num" id="flashNum"></div>
      <h2>¡Es tu turno!</h2>
      <p>Acércate a Daniel ahora 🙌</p>
      <button onclick="dismissFlash()">Entendido ✓</button>
    </div>

    <header>
      <h1>🎫 Turnos</h1>
      <p>Saca tu número!</p>
      <a href="/admin.html">Panel de Daniel →</a>
    </header>

    <main>
      <!-- turno actual -->
      <div class="card">
        <div class="label">Atendiendo ahora</div>
        <div class="big-num zero" id="currentTurn">–</div>
        <div class="badge green" id="waitingBadge">Trabajando en sus cosas</div>
        <div class="live">
          <div class="dot"></div>
          En vivo
        </div>
      </div>

      <!-- mi turno -->
      <div id="ticketSection"></div>

      <!-- aviso de renumerado tras rechazo -->
      <div id="renumberNotice"></div>
    </main>

    <script>
      let myTicket = parseInt(localStorage.getItem("turno_ticket")) || null;
      let myToken = localStorage.getItem("turno_token") || null;
      let savedName = localStorage.getItem("turno_user_name") || "";
      let currentTurn = 0;
      let lastTicket = 0;
      let activeQueue = [];
      let lastVersion = -1;
      let renumberCheckInFlight = false;

      // Si tenemos número pero no token (estado legacy), forzamos limpieza.
      if (myTicket && !myToken) {
        myTicket = null;
        localStorage.removeItem("turno_ticket");
      }

      let flashShown = false;

      const currentTurnEl = document.getElementById("currentTurn");
      const waitingBadgeEl = document.getElementById("waitingBadge");
      const ticketSection = document.getElementById("ticketSection");
      const flashEl = document.getElementById("flash");
      const flashNumEl = document.getElementById("flashNum");

      // Web Audio beep
      function beep() {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          [440, 550, 660].forEach((freq, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.frequency.value = freq;
            osc.type = "sine";
            gain.gain.setValueAtTime(0.4, ctx.currentTime + i * 0.15);
            gain.gain.exponentialRampToValueAtTime(
              0.001,
              ctx.currentTime + i * 0.15 + 0.3,
            );
            osc.start(ctx.currentTime + i * 0.15);
            osc.stop(ctx.currentTime + i * 0.15 + 0.3);
          });
        } catch (_) {}
      }

      function vibrate() {
        try {
          navigator.vibrate?.([200, 100, 200, 100, 400]);
        } catch (_) {}
      }

      function showFlash(num) {
        flashNumEl.textContent = num;
        flashEl.classList.add("show");
        beep();
        vibrate();
      }

      function dismissFlash() {
        flashEl.classList.remove("show");
      }

      function popNumber(el) {
        el.classList.remove("pop");
        void el.offsetWidth;
        el.classList.add("pop");
        setTimeout(() => el.classList.remove("pop"), 300);
      }

      function updateUI(data) {
        // descartar payloads viejos
        if (typeof data.version === "number") {
          if (data.version < lastVersion) return;
          lastVersion = data.version;
        }

        const prevTurn = currentTurn;
        currentTurn = data.currentTurn;
        lastTicket = data.lastTicket;
        activeQueue = data.queue || [];

        // Si tenemos token pero el ticket local no aparece, puede ser:
        //  - renumerado tras rechazo (token sigue, ticket cambia)
        //  - cancelado server-side / reset
        // Consultamos al servidor con el token. NO limpiamos ante fallos.
        if (
          myToken &&
          myTicket &&
          !activeQueue.includes(myTicket) &&
          myTicket !== currentTurn
        ) {
          checkMyTicket();
        }

        // current turn display
        if (currentTurn === 0) {
          currentTurnEl.textContent = "–";
          currentTurnEl.className = "big-num zero";
        } else {
          currentTurnEl.textContent = currentTurn;
          currentTurnEl.className = "big-num";
          if (currentTurn !== prevTurn) popNumber(currentTurnEl);
        }

        // badge
        const w = data.waiting;
        if (w === 0) {
          waitingBadgeEl.textContent = "Trabajando en sus cosas";
          waitingBadgeEl.className = "badge green";
        } else {
          waitingBadgeEl.textContent = `${w} ${w === 1 ? "persona" : "personas"} esperando`;
          waitingBadgeEl.className = "badge amber";
        }

        // check if it's my turn
        if (myTicket && myTicket === currentTurn && !flashShown) {
          flashShown = true;
          showFlash(myTicket);
        }
        if (myTicket && myTicket !== currentTurn) flashShown = false;

        renderTicket();
      }

      async function checkMyTicket() {
        if (!myToken || renumberCheckInFlight) return;
        renumberCheckInFlight = true;
        try {
          const r = await fetch("/api/my-ticket", {
            headers: { "X-Ticket-Token": myToken },
          });
          if (!r.ok) return; // fallo transitorio: no tocar nada
          const d = await r.json();
          if (d.ticket === null) {
            // cancelado/reset server-side
            myTicket = null;
            myToken = null;
            localStorage.removeItem("turno_ticket");
            localStorage.removeItem("turno_token");
            hideRenumberNotice();
            renderTicket();
          } else if (d.ticket !== myTicket) {
            const oldTicket = myTicket;
            myTicket = d.ticket;
            localStorage.setItem("turno_ticket", String(myTicket));
            flashShown = false;
            showRenumberNotice(oldTicket, myTicket);
            renderTicket();
          }
        } catch (_) {
          // sin red: no hacer nada
        } finally {
          renumberCheckInFlight = false;
        }
      }

      function showRenumberNotice(oldNum, newNum) {
        const el = document.getElementById("renumberNotice");
        el.textContent = `Tu turno fue reagendado: ahora eres el #${newNum} (antes #${oldNum}).`;
        el.classList.add("show");
        try { navigator.vibrate?.(150); } catch (_) {}
      }
      function hideRenumberNotice() {
        const el = document.getElementById("renumberNotice");
        if (el) {
          el.classList.remove("show");
          el.textContent = "";
        }
      }

      function renderTicket() {
        if (!myTicket) {
          hideRenumberNotice();
          // Construimos el form sin innerHTML para los datos dinámicos.
          ticketSection.innerHTML = "";
          const card = document.createElement("div");
          card.className = "card get-ticket";

          const label = document.createElement("div");
          label.className = "label";
          label.textContent = "Saca tu turno";
          card.appendChild(label);

          const sub = document.createElement("p");
          sub.className = "subtitle";
          sub.textContent =
            "Déjanos tu nombre y te avisaremos cuando llegue tu turno";
          card.appendChild(sub);

          const fName = document.createElement("div");
          fName.className = "field";
          const lblN = document.createElement("label");
          lblN.setAttribute("for", "inpName");
          lblN.textContent = "Tu nombre";
          const inpN = document.createElement("input");
          inpN.id = "inpName";
          inpN.type = "text";
          inpN.maxLength = 60;
          inpN.placeholder = "Ej. María";
          inpN.value = savedName;
          inpN.autocomplete = "given-name";
          fName.appendChild(lblN);
          fName.appendChild(inpN);
          const errN = document.createElement("p");
          errN.className = "field-error";
          errN.id = "errName";
          errN.textContent = "Escribe tu nombre, por favor";
          fName.appendChild(errN);
          card.appendChild(fName);

          const fSubj = document.createElement("div");
          fSubj.className = "field";
          const lblS = document.createElement("label");
          lblS.setAttribute("for", "inpSubject");
          lblS.textContent = "Asunto (opcional)";
          const inpS = document.createElement("textarea");
          inpS.id = "inpSubject";
          inpS.maxLength = 200;
          inpS.placeholder = "¿De qué quieres hablar?";
          fSubj.appendChild(lblS);
          fSubj.appendChild(inpS);
          card.appendChild(fSubj);

          const btn = document.createElement("button");
          btn.className = "btn btn-primary";
          btn.id = "btnTake";
          btn.style.marginTop = "1rem";
          btn.textContent = "🎫 Quiero un turno";
          btn.addEventListener("click", takeTicket);
          card.appendChild(btn);

          ticketSection.appendChild(card);
          return;
        }

        const ahead = activeQueue.filter(
          (t) => t > currentTurn && t < myTicket,
        ).length;
        const isMyTurn = currentTurn === myTicket;

        if (isMyTurn) {
          ticketSection.innerHTML = `
        <div class="card my-turn">
          <div class="label">Tu número</div>
          <div class="big-num">${myTicket}</div>
          <p class="subtitle">🎉 ¡Es tu turno! Acércate a Daniel</p>
          <button class="btn btn-ghost-white" onclick="releaseTicket()">Ya he ido ✓</button>
        </div>`;
        } else {
          const aheadText =
            ahead === 0
              ? "Eres el próximo 🙌"
              : ahead === 1
                ? "1 persona delante de ti"
                : `${ahead} personas delante de ti`;
          ticketSection.innerHTML = `
        <div class="card waiting">
          <div class="label">Tu número</div>
          <div class="big-num">${myTicket}</div>
          <p class="ahead-text">${aheadText}</p>
          <button class="btn btn-ghost" style="margin-top:1rem" onclick="releaseTicket()">Cancelar turno</button>
        </div>`;
        }
      }

      async function takeTicket() {
        const inpN = document.getElementById("inpName");
        const inpS = document.getElementById("inpSubject");
        const errN = document.getElementById("errName");
        const btn = document.getElementById("btnTake");
        const name = (inpN.value || "").trim();
        const subject = (inpS.value || "").trim();
        if (!name) {
          errN.classList.add("show");
          inpN.focus();
          return;
        }
        errN.classList.remove("show");
        btn.disabled = true;
        btn.textContent = "Enviando…";
        try {
          const r = await fetch("/api/ticket", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, subject }),
          });
          if (!r.ok) throw new Error("bad response");
          const d = await r.json();
          myTicket = d.ticket;
          myToken = d.token;
          savedName = name;
          flashShown = false;
          localStorage.setItem("turno_ticket", String(myTicket));
          localStorage.setItem("turno_token", myToken);
          localStorage.setItem("turno_user_name", savedName);
          hideRenumberNotice();
          renderTicket();
        } catch (_) {
          btn.disabled = false;
          btn.textContent = "🎫 Quiero un turno";
          alert("No se pudo sacar turno. Revisa la conexión.");
        }
      }

      async function releaseTicket() {
        const num = myTicket;
        const token = myToken;
        myTicket = null;
        myToken = null;
        flashShown = false;
        localStorage.removeItem("turno_ticket");
        localStorage.removeItem("turno_token");
        hideRenumberNotice();
        renderTicket();
        try {
          await fetch(`/api/ticket/${num}`, {
            method: "DELETE",
            headers: token ? { "X-Ticket-Token": token } : {},
          });
        } catch (_) {}
      }

      // SSE
      const sse = new EventSource("/api/events");
      sse.onmessage = (e) => updateUI(JSON.parse(e.data));

      renderTicket();
    </script>
  </body>
</html>
